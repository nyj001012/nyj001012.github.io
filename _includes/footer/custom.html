<script type="module">
  const mermaidBlocks = document.querySelectorAll(
    ".page__content .language-mermaid"
  );

  if (mermaidBlocks.length > 0) {
    const { default: mermaid } = await import(
      "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"
    );
    const diagrams = [];
    const processed = new Set();

    mermaidBlocks.forEach((block) => {
      const container = block.matches("div.highlighter-rouge")
        ? block
        : block.closest("div.highlighter-rouge") ||
          block.closest("pre") ||
          block;

      if (!container.isConnected || processed.has(container)) return;

      const code = container.querySelector("code") || block;
      const diagram = document.createElement("pre");
      diagram.className = "mermaid";
      diagram.textContent = code.textContent;

      processed.add(container);
      container.replaceWith(diagram);
      diagrams.push(diagram);
    });

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: "neutral"
    });
    await mermaid.run({ nodes: diagrams });
  }
</script>
